openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: video-generations
    description: Generate dance videos from user photos
paths:
  /catalogue:
    get:
      operationId: listCatalogue
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: category, in: query, schema: { type: string, enum: [all, kpop, street, disco, trend] } }
        - { name: speed, in: query, schema: { type: string, enum: [any, chill, hype] } }
        - { name: section, in: query, schema: { type: string, enum: [all, featured, recommended] } }
      responses:
        "200":
          description: Published catalogue in stable editorial order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CataloguePage" }
  /catalogue/{id}:
    get:
      operationId: getCatalogueTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Published template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTemplate" }
        "404": { description: Not published }
  /admin/catalogue:
    get:
      operationId: listAdminCatalogue
      responses:
        "200":
          description: All templates including drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueTemplate" }
    post:
      operationId: createCatalogueTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueInput" }
      responses:
        "201":
          description: Created unpublished template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTemplate" }
  /admin/catalogue/{id}:
    put:
      operationId: updateCatalogueTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueInput" }
      responses:
        "200":
          description: Updated template; publication requires uploaded poster and original
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTemplate" }
  /admin/dance-templates/{id}/{asset}:
    put:
      operationId: putCatalogueMedia
      summary: Upload or atomically replace an allowlisted catalogue file
      description: Requires a verified administrator and same-origin request or verified native bearer token. Raw binary body; maximum 100 MiB for videos or 10 MiB for JPEG. Does not accept arbitrary bucket keys.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,79}$"
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [video.mp4, preview.mp4, preview.webm, poster.jpg, character-01.jpg, character-02.jpg, reference-poster.jpg, result.mp4, result-preview.mp4, result.webm]
      requestBody:
        required: true
        content:
          video/mp4:
            schema: { $ref: "#/components/schemas/CatalogueMediaInput" }
          video/webm:
            schema: { $ref: "#/components/schemas/CatalogueMediaInput" }
          image/jpeg:
            schema: { $ref: "#/components/schemas/CatalogueMediaInput" }
      responses:
        "200":
          description: File saved; id, asset, size in bytes, and storage ETag
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  asset: { type: string }
                  size: { type: integer }
                  etag: { type: string }
                required: [id, asset, size]
        "400":
          description: Empty body, interrupted upload or content signature mismatch
        "401":
          description: Authentication required
        "403":
          description: Administrator required or mutation origin rejected
        "404":
          description: File is not allowlisted
        "413":
          description: File too large
        "415":
          description: Incorrect Content-Type or compressed request
        "429":
          description: Another upload is in progress; retry after five seconds
        "503":
          description: R2 not configured or save could not be confirmed
  /dance-templates/{id}/{asset}:
    get:
      operationId: getDanceTemplateMedia
      summary: Public video or poster for a published dance template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,79}$"
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [video.mp4, preview.mp4, preview.webm, poster.jpg, character-01.jpg, character-02.jpg, reference-poster.jpg, result.mp4, result-preview.mp4, result.webm]
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Complete public media file
          content:
            video/mp4:
              schema: { type: string, format: binary }
            video/webm:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "206":
          description: Requested media byte range
          content:
            video/mp4:
              schema: { type: string, format: binary }
            video/webm:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "404":
          description: Unknown template, asset, or missing object
        "304":
          description: Cached ETag or Last-Modified is still current
        "416":
          description: Invalid or unsatisfiable byte range
        "503":
          description: Media storage is unavailable
  /account/subscription:
    get:
      operationId: getAccountSubscription
      responses:
        "200":
          description: Server-confirmed subscription of the authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSubscription" }
        "401":
          description: Sign-in required
        "403":
          description: Account blocked
        "503":
          description: Subscription cannot be verified
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Authenticated identity and server-verified role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Live database statistics, never sample data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/users:
    get:
      operationId: listAdminUsers
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Users, 25 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsersPage" }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 150 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated controls, not a paid subscription grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/generations:
    get:
      operationId: listAdminGenerations
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [all, queued, running, succeeded, failed], default: all } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Generation ledger, 25 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGenerationsPage" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      responses:
        "200":
          description: Generation controls and credential presence only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
    patch:
      operationId: updateAdminSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsInput" }
      responses:
        "200":
          description: Saved settings; optimistic version conflict returns 409
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
  /admin/audit:
    get:
      operationId: listAdminAudit
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Administrative actions, 25 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /video-generations:
    post:
      operationId: createVideoGeneration
      tags: [video-generations]
      summary: Start a dance video generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGenerationInput"
      responses:
        "202":
          description: Generation accepted by the provider queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGenerationSubmission"
        "400":
          description: Invalid image or generation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Quota, concurrency or daily budget limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Generation paused, budget missing or video provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Account blocked or paid subscription required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Idempotency key already used with different settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Video provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /video-generations/{requestId}:
    get:
      operationId: getVideoGeneration
      tags: [video-generations]
      summary: Check a dance video generation
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Current provider status and generated video URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGenerationStatus"
        "400":
          description: Invalid request id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Generation not found or not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Video provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Video provider status could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CatalogueInput:
      type: object
      required: [title, dancer, category, tagline, description, bpm, energy, durations, moves, color, isNew, sourceDurationSeconds, published, sortOrder, referenceCount, hasVideoPoster, hasExample, prompt]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        dancer: { type: string, maxLength: 200 }
        category: { type: string, enum: [kpop, street, disco, trend] }
        tagline: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        bpm: { type: [integer, "null"], minimum: 1, maximum: 400 }
        energy: { type: [integer, "null"], minimum: 1, maximum: 5 }
        durations: { type: array, minItems: 1, maxItems: 20, items: { type: integer, minimum: 1, maximum: 300 } }
        moves: { type: array, maxItems: 50, items: { type: string, maxLength: 500 } }
        color: { type: string, enum: [primary, secondary, accent, violet, sun] }
        isNew: { type: boolean }
        sourceDurationSeconds: { type: [number, "null"], minimum: 0.1, maximum: 300 }
        published: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 1000000 }
        referenceCount: { type: integer, minimum: 0, maximum: 2 }
        hasVideoPoster: { type: boolean }
        hasExample: { type: boolean }
        prompt: { type: string, maxLength: 10000 }
    CatalogueTemplate:
      allOf:
        - { $ref: "#/components/schemas/CatalogueInput" }
        - type: object
          required: [id, imageUri, videoUri, referenceImageUris]
          properties:
            id: { type: string }
            imageUri: { type: string }
            videoUri: { type: string }
            videoPosterUri: { type: string }
            exampleResultUri: { type: string }
            referenceImageUris: { type: array, items: { type: string } }
    CataloguePage:
      type: object
      required: [items, nextCursor, hasNextPage, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CatalogueTemplate" } }
        nextCursor: { type: [string, "null"] }
        hasNextPage: { type: boolean }
        total: { type: integer }
    CatalogueMediaInput:
      type: string
      format: binary
    AccountSubscription:
      type: object
      required: [accountId, plan, status, subscriptionUntil]
      properties:
        accountId: { type: string }
        plan: { type: string, enum: [none, warmup, dancefloor, stage] }
        status: { type: string, enum: [inactive, active, expired] }
        subscriptionUntil: { type: [string, "null"] }
    AdminSession:
      type: object
      required: [userId, email, isAdmin, environment]
      properties:
        userId: { type: string }
        email: { type: string }
        isAdmin: { type: boolean }
        environment: { type: string }
    AdminOverview:
      type: object
      required: [users, blockedUsers, activeSubscriptions, generations, succeeded, failed, queued, running, todayGenerations, todayEstimatedCostRub, estimatedCostRub, unpricedGenerations, generatedAt, telemetryConnected]
      properties:
        users: { type: integer }
        blockedUsers: { type: integer }
        activeSubscriptions: { type: integer }
        generations: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        queued: { type: integer }
        running: { type: integer }
        todayGenerations: { type: integer }
        todayEstimatedCostRub: { type: number }
        estimatedCostRub: { type: number }
        unpricedGenerations: { type: integer }
        generatedAt: { type: string }
        telemetryConnected: { type: boolean }
    AdminUser:
      type: object
      required: [id, email, role, blocked, plan, subscriptionUntil, dailyLimitOverride, totalGenerations, todayGenerations, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        blocked: { type: boolean }
        plan: { type: string, enum: [none, warmup, dancefloor, stage] }
        subscriptionUntil: { type: [string, "null"] }
        dailyLimitOverride: { type: [integer, "null"], minimum: 0, maximum: 10000 }
        totalGenerations: { type: integer }
        todayGenerations: { type: integer }
        createdAt: { type: string }
    AdminUserUpdate:
      type: object
      additionalProperties: false
      required: [blocked, dailyLimitOverride]
      properties:
        blocked: { type: boolean }
        dailyLimitOverride: { type: [integer, "null"], minimum: 0, maximum: 10000 }
    AdminUsersPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminGeneration:
      type: object
      required: [id, userId, userEmail, templateId, status, estimatedCostRub, errorCode, createdAt, completedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        userEmail: { type: string }
        templateId: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        estimatedCostRub: { type: [number, "null"] }
        errorCode: { type: [string, "null"] }
        createdAt: { type: string }
        completedAt: { type: [string, "null"] }
    AdminGenerationsPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminGeneration" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminSettingsInput:
      type: object
      additionalProperties: false
      required: [version, paused, maxConcurrent, perUserConcurrent, maxDailySpendRub, costPerGenerationRub]
      properties:
        version: { type: integer, minimum: 0 }
        paused: { type: boolean }
        maxConcurrent: { type: integer, minimum: 1, maximum: 50 }
        perUserConcurrent: { type: integer, minimum: 1, maximum: 5 }
        maxDailySpendRub: { type: [number, "null"], minimum: 1, maximum: 1000000 }
        costPerGenerationRub: { type: [number, "null"], minimum: 0.01, maximum: 100000 }
    AdminSettings:
      allOf:
        - { $ref: "#/components/schemas/AdminSettingsInput" }
        - type: object
          required: [providerKeyConfigured, provider, keyStorage, telemetryConnected, quotaTimezone, updatedAt]
          properties:
            providerKeyConfigured: { type: boolean }
            provider: { type: string }
            keyStorage: { type: string }
            telemetryConnected: { type: boolean }
            quotaTimezone: { type: string }
            updatedAt: { type: string }
    AdminAuditEntry:
      type: object
      required: [id, actorId, action, targetId, details, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        action: { type: string }
        targetId: { type: [string, "null"] }
        details: { type: string }
        createdAt: { type: string }
    AdminAuditPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminAuditEntry" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    VideoGenerationInput:
      type: object
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 100
        imageDataUrl:
          type: string
          minLength: 100
          maxLength: 18000000
          pattern: "^data:image/(jpeg|png|webp);base64,"
        styleId:
          type: string
          enum:
            - bubblegum-rush
            - lime-voltage
            - hexa-star
            - confetti-cannon
            - grid-runner
            - velvet-orbit
            - seoul-sparkle
        duration:
          type: integer
          enum: [5, 10, 15]
      required: [clientRequestId, imageDataUrl, styleId, duration]
    VideoGenerationSubmission:
      type: object
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [queued]
      required: [requestId, status]
    VideoGenerationStatus:
      type: object
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed]
        videoUrl:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        queuePosition:
          type: ["integer", "null"]
      required: [requestId, status, videoUrl, error, queuePosition]

