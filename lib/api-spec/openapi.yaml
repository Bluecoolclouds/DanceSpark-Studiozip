openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: video-generations
    description: Generate dance videos from user photos
paths:
  /privacy-policy:
    get:
      operationId: getPrivacyPolicy
      description: Public Russian-language draft of the Danceflow privacy policy. Must not be used for store publication until the marked operator and retention details are verified.
      responses:
        "200":
          description: HTML privacy policy draft
          content:
            text/html:
              schema: { type: string }
  /auth/config:
    get:
      operationId: getAuthConfig
      responses:
        "200":
          description: Public browser authentication configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthConfig" }
  /auth/session:
    get:
      operationId: getAuthSession
      responses:
        "200":
          description: Stable Danceflow account, not the external provider subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DanceAuthSession" }
        "401": { description: Sign in required }
        "403": { description: Account blocked }
        "409": { description: Account linkage required }
  /auth/logto/link:
    post:
      operationId: linkLogtoAccount
      description: Requires a verified Clerk session and Logto proof; never links by email alone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogtoIdentityProof" }
      responses:
        "200":
          description: Linked without changing account ownership or role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DanceAuthSession" }
        "409": { description: Identity belongs to another account }
  /auth/logto/register:
    post:
      operationId: registerLogtoAccount
      description: Explicit new registration. Existing accounts require proof of ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogtoRegistration" }
      responses:
        "201":
          description: Registered canonical account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DanceAuthSession" }
        "409": { description: Existing account requires linkage }
  /catalogue:
    get:
      operationId: listCatalogue
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: category, in: query, schema: { type: string, enum: [all, kpop, street, disco, trend] } }
        - { name: speed, in: query, schema: { type: string, enum: [any, chill, hype] } }
        - { name: section, in: query, schema: { type: string, enum: [all, featured, recommended] } }
      responses:
        "200":
          description: Published catalogue in stable editorial order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CataloguePage" }
  /catalogue/{id}:
    get:
      operationId: getCatalogueTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Published template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTemplate" }
        "404": { description: Not published }
  /catalogue/{id}/open:
    post:
      operationId: recordCatalogueOpen
      description: >-
        Records a unique published-template detail open for a rotating anonymous visitor token.
        Reopens with the same token remain valid. To limit artificial ranking inflation, only one
        distinct token per network source and template is counted within seven days. The source
        address is used transiently in memory as a keyed digest and is not persisted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueOpenInput" }
      responses:
        "204": { description: Open recorded or already counted in the current window }
        "404": { description: Not published }
  /admin/catalogue:
    get:
      operationId: listAdminCatalogue
      responses:
        "200":
          description: All templates including drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueTemplate" }
    post:
      operationId: createCatalogueTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueInput" }
      responses:
        "201":
          description: Created unpublished template
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTemplate" }
  /admin/catalogue/{id}:
    put:
      operationId: updateCatalogueTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueInput" }
      responses:
        "200":
          description: Updated template; publication requires uploaded poster and original
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueTemplate" }
  /admin/dance-templates/{id}/{asset}:
    put:
      operationId: putCatalogueMedia
      summary: Upload or atomically replace an allowlisted catalogue file
      description: Requires a verified administrator and same-origin request or verified native bearer token. Raw binary body; maximum 100 MiB for videos or 10 MiB for JPEG. Does not accept arbitrary bucket keys.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,79}$"
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [video.mp4, preview.mp4, preview.webm, poster.jpg, character-01.jpg, character-02.jpg, reference-poster.jpg, result.mp4, result-preview.mp4, result.webm]
      requestBody:
        required: true
        content:
          video/mp4:
            schema: { $ref: "#/components/schemas/CatalogueMediaInput" }
          video/webm:
            schema: { $ref: "#/components/schemas/CatalogueMediaInput" }
          image/jpeg:
            schema: { $ref: "#/components/schemas/CatalogueMediaInput" }
      responses:
        "200":
          description: File saved; id, asset, size in bytes, and storage ETag
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  asset: { type: string }
                  size: { type: integer }
                  etag: { type: string }
                required: [id, asset, size]
        "400":
          description: Empty body, interrupted upload or content signature mismatch
        "401":
          description: Authentication required
        "403":
          description: Administrator required or mutation origin rejected
        "404":
          description: File is not allowlisted
        "413":
          description: File too large
        "415":
          description: Incorrect Content-Type or compressed request
        "429":
          description: Another upload is in progress; retry after five seconds
        "503":
          description: R2 not configured or save could not be confirmed
  /dance-templates/{id}/{asset}:
    get:
      operationId: getDanceTemplateMedia
      summary: Public video or poster for a published dance template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,79}$"
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [video.mp4, preview.mp4, preview.webm, poster.jpg, character-01.jpg, character-02.jpg, reference-poster.jpg, result.mp4, result-preview.mp4, result.webm]
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Complete public media file
          content:
            video/mp4:
              schema: { type: string, format: binary }
            video/webm:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "206":
          description: Requested media byte range
          content:
            video/mp4:
              schema: { type: string, format: binary }
            video/webm:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "404":
          description: Unknown template, asset, or missing object
        "304":
          description: Cached ETag or Last-Modified is still current
        "416":
          description: Invalid or unsatisfiable byte range
        "503":
          description: Media storage is unavailable
  /account/deletion:
    get:
      operationId: getAccountDeletion
      responses:
        "200":
          description: Deletion status for the authenticated account only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletion" }
        "401": { description: Sign in required or identity already removed }
    post:
      operationId: requestAccountDeletion
      description: Irreversible self-service deletion. Never accepts a target account ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletionInput" }
      responses:
        "200":
          description: Deletion completed or durably queued for retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletion" }
        "400": { description: Explicit confirmation required }
        "401": { description: Sign in required }
        "409": { description: "Active or uncertain generation, last administrator, or linked identity prevents deletion" }
        "503": { description: Deletion request could not be saved; do not report success }
  /account/subscription:
    get:
      operationId: getAccountSubscription
      responses:
        "200":
          description: Server-confirmed subscription of the authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSubscription" }
        "401":
          description: Sign-in required
        "403":
          description: Account blocked
        "503":
          description: Subscription cannot be verified
  /account/credits:
    get:
      operationId: getAccountCredits
      responses:
        "200":
          description: Current UTC-day credits for the authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountCredits" }
        "401": { description: Sign-in required }
        "403": { description: Account blocked }
        "503": { description: Daily credits are unavailable }
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Authenticated identity and server-verified role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Live database statistics, never sample data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/users:
    get:
      operationId: listAdminUsers
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Users, 25 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsersPage" }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 150 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: Updated controls, not a paid subscription grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/generations:
    get:
      operationId: listAdminGenerations
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [all, queued, running, succeeded, failed], default: all } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Generation ledger, 25 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGenerationsPage" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      responses:
        "200":
          description: Generation controls and credential presence only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
    patch:
      operationId: updateAdminSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsInput" }
      responses:
        "200":
          description: Saved settings; optimistic version conflict returns 409
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
  /admin/credit-economy:
    get:
      operationId: getAdminCreditEconomy
      parameters:
        - { in: query, name: seconds, schema: { type: number, minimum: 4, maximum: 300, default: 15 } }
      responses:
        "200":
          description: Server-calculated model prices and maximum daily free-credit exposure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreditEconomy" }
  /admin/audit:
    get:
      operationId: listAdminAudit
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Administrative actions, 25 per page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /light-swapper/quote:
    get:
      operationId: getLightSwapperQuote
      tags: [video-generations]
      summary: Get the exact server-calculated cost before launch
      parameters:
        - { in: query, name: model, required: true, schema: { type: string, enum: [higgsfield/genjutsu-light/motion-transfer/v1.0, higgsfield/genjutsu-light/object-swap/v1.0, higgsfield/genjutsu/motion-transfer/v1.0, higgsfield/genjutsu/object-swap/v1.0] } }
        - { in: query, name: resolution, required: true, schema: { type: string, enum: [480p, 720p, 1080p] } }
        - { in: query, name: templateId, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,79}$" } }
        - { in: query, name: sourceVideoId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Price for the actual server-validated input duration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LightSwapperQuote" }
        "400": { description: "Invalid model, source or media" }
        "401": { description: Authentication required }
        "403": { description: "Account blocked or source is not owned" }
        "503": { description: Model price or currency rate is unavailable }
  /light-swapper/generations:
    post:
      operationId: createLightSwapperGeneration
      tags: [video-generations]
      summary: Submit the selected Genjutsu or Genjutsu Light v1.0 model
      description: Authenticated accounts with sufficient daily credits or available subscription quota. Uses the published template original MP4, never a preview. Photos are inline JPEG/PNG/WebP in selection order; maximum 12 MiB decoded in total and 18 MiB JSON. No local URI or remote input URL is accepted. Duration and audio controls are unsupported. Reuse clientRequestId for retries; a changed payload conflicts. No automatic paid retries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LightSwapperInput" }
      responses:
        "202":
          description: Durable application job identifier; replay does not resubmit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoGenerationSubmission" }
        "400": { description: "Invalid model, media, template or parameters" }
        "401": { description: Authentication required }
        "403": { description: "Account blocked, invalid origin or insufficient credits and subscription access" }
        "409": { description: Idempotency key reused with different parameters }
        "413": { description: Input too large }
        "429": { description: "Quota, concurrency or budget exhausted" }
        "502": { description: Upload failed or submission acknowledgement uncertain; never automatically resubmit }
        "503": { description: "Paused, unconfigured provider or unavailable original" }
  /light-swapper/source-videos:
    post:
      operationId: uploadLightSwapperSourceVideo
      tags: [video-generations]
      summary: Validate and privately store an authenticated user's own video
      description: Accepts raw MP4 bytes only. The server validates the actual media and duration, then returns an owner-scoped identifier. Uploading is not a paid generation.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Private upload accepted after server-side media inspection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LightSwapperSourceVideo" }
        "400": { description: Invalid MP4 or unsupported duration }
        "401": { description: Authentication required }
        "403": { description: Authenticated request required }
        "413": { description: Video exceeds the upload size limit }
        "415": { description: Only MP4 uploads are accepted }
        "429": { description: Another upload is already being processed }
        "503": { description: Private storage or media validation is unavailable }
  /light-swapper/custom-video-generations:
    post:
      operationId: createCustomVideoLightSwapperGeneration
      tags: [video-generations]
      summary: Submit Light Swapper using an owned, validated video
      description: Authenticated accounts with sufficient daily credits or available subscription quota. The sourceVideoId must belong to the authenticated owner and refer to a video previously validated by the server. The server determines duration and price; local URIs, remote URLs and client-supplied durations are not accepted. Reuse clientRequestId for retries; a changed payload conflicts. No automatic paid retries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomVideoLightSwapperInput" }
      responses:
        "202":
          description: Durable application job identifier; replay does not resubmit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoGenerationSubmission" }
        "400": { description: "Invalid model, media or parameters" }
        "401": { description: Authentication required }
        "403": { description: "Account blocked or insufficient credits and subscription access" }
        "409": { description: "Idempotency key reused with different parameters" }
        "413": { description: Input too large }
        "429": { description: "Quota, concurrency or budget exhausted" }
        "502": { description: "Upload failed or submission acknowledgement uncertain; never automatically resubmit" }
        "503": { description: "Paused, unconfigured provider, storage or pricing" }
  /light-swapper/generations/by-client/{clientRequestId}:
    get:
      operationId: findLightSwapperGeneration
      tags: [video-generations]
      summary: Recover an owned Light Swapper job without submitting
      parameters:
        - name: clientRequestId
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,150}$" }
      responses:
        "200":
          description: Owned job status, or null if no reservation exists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/VideoGenerationStatus"
                nullable: true
        "401": { description: Authentication required }
        "400": { description: Invalid client request id }
        "502": { description: Status unavailable; safe to retry this read }
  /video-generations:
    post:
      operationId: createVideoGeneration
      tags: [video-generations]
      summary: Start a dance video generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoGenerationInput"
      responses:
        "202":
          description: Generation accepted by the provider queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGenerationSubmission"
        "400":
          description: Invalid image or generation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Quota, concurrency or daily budget limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Generation paused, budget missing or video provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Account blocked or paid subscription required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Idempotency key already used with different settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Video provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /video-generations/{requestId}:
    get:
      operationId: getVideoGeneration
      tags: [video-generations]
      summary: Check a dance video generation
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Current provider status and generated video URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGenerationStatus"
        "400":
          description: Invalid request id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Generation not found or not owned by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Video provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Video provider status could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    WebAuthConfig:
      type: object
      required: [enabled, endpoint, webAppId, adminAppId, resource]
      properties:
        enabled: { type: boolean }
        endpoint: { type: string }
        webAppId: { type: string }
        adminAppId: { type: string }
        resource: { type: string }
    DanceAuthSession:
      type: object
      required: [accountId, email, role]
      properties:
        accountId: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
    LogtoIdentityProof:
      type: object
      additionalProperties: false
      required: [accessToken, idToken]
      properties:
        accessToken: { type: string, minLength: 20, maxLength: 20000 }
        idToken: { type: string, minLength: 20, maxLength: 20000 }
    LogtoRegistration:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 20, maxLength: 20000 }
    LightSwapperInput:
      type: object
      additionalProperties: false
      required: [clientRequestId, model, templateId, photos, prompt, resolution]
      properties:
        maxCredits: { type: integer, minimum: 1, maximum: 1000000000, description: "Maximum server-calculated credit price approved by this client. Reject a changed higher price without reserving." }
        clientRequestId: { type: string, pattern: "^[A-Za-z0-9_-]{8,150}$" }
        model:
          type: string
          enum: [higgsfield/genjutsu-light/motion-transfer/v1.0, higgsfield/genjutsu-light/object-swap/v1.0, higgsfield/genjutsu/motion-transfer/v1.0, higgsfield/genjutsu/object-swap/v1.0]
        templateId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,79}$" }
        photos:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, maxLength: 16777260, pattern: "^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$" }
        prompt: { type: string, maxLength: 10000 }
        resolution: { type: string, enum: [480p, 720p, 1080p] }
    CustomVideoLightSwapperInput:
      type: object
      additionalProperties: false
      required: [clientRequestId, model, sourceVideoId, photos, prompt, resolution]
      properties:
        maxCredits: { type: integer, minimum: 1, maximum: 1000000000, description: "Maximum server-calculated credit price approved by this client. Reject a changed higher price without reserving." }
        clientRequestId: { type: string, pattern: "^[A-Za-z0-9_-]{8,150}$" }
        model:
          type: string
          enum: [higgsfield/genjutsu-light/motion-transfer/v1.0, higgsfield/genjutsu-light/object-swap/v1.0, higgsfield/genjutsu/motion-transfer/v1.0, higgsfield/genjutsu/object-swap/v1.0]
        sourceVideoId: { type: string, format: uuid }
        photos:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, maxLength: 16777260, pattern: "^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$" }
        prompt: { type: string, maxLength: 10000 }
        resolution: { type: string, enum: [480p, 720p, 1080p] }
